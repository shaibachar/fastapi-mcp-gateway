[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-mcp-gateway"
version = "0.1.0"
description = "Zero-boilerplate library to expose REST APIs as MCP servers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["fastapi", "mcp", "model-context-protocol", "openapi", "rest-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.25.0",
    "mcp>=0.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
]
graphql = [
    "graphql-core>=3.2.0",
    "strawberry-graphql>=0.200.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "graphql-core>=3.2.0",
    "strawberry-graphql>=0.200.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/fastapi-mcp-gateway"
Repository = "https://github.com/yourusername/fastapi-mcp-gateway"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastapi_mcp_gateway*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
